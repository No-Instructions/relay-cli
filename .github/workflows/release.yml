name: Prepare release draft

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Stable version without v (for example 1.2.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release_version: ${{ inputs.release_version }}
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: releases
      - name: Verify artifacts and create a draft for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_COMMIT: ${{ github.sha }}
        working-directory: releases
        run: |
          test "$(cat version.txt)" = "$RELEASE_VERSION"
          for platform in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            sha256sum -c "relay-cli-$platform.tar.gz.sha256"
          done
          gh release create "v$RELEASE_VERSION" --target "$RELEASE_COMMIT" \
            --draft --title "Relay CLI $RELEASE_VERSION" --generate-notes \
            version.txt ./*.tar.gz ./*.sha256
