name: Public build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_version:
        type: string
        default: '0.0.0'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.13.0', '24.17.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node bin/relay.js --help
      - run: npm run build:staging
      - run: node bin/relay.js --help
  install:
    name: Standalone (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-15
            platform: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.17.0'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: npm ci
      - name: Build standalone executable
        env:
          RELEASE_VERSION: ${{ inputs.release_version || '0.0.0' }}
        run: bun scripts/build-release.mjs "$RELEASE_VERSION" "$RUNNER_TEMP/releases"
      - name: Install and exercise the standalone executable
        shell: sh
        env:
          RMD_RELEASE_DIR: ${{ runner.temp }}/releases
          RMD_INSTALL_DIR: ${{ runner.temp }}/relay cli
          RMD_BIN_DIR: ${{ runner.temp }}/relay bin
          RMD_STORAGE_KEY_FILE: ${{ runner.temp }}/storage.key
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
        run: |
          sh -n install.sh
          sh install.sh
          node --input-type=module -e 'import fs from "node:fs"; import crypto from "node:crypto"; fs.writeFileSync(process.env.RMD_STORAGE_KEY_FILE, crypto.randomBytes(32).toString("hex"), {mode: 0o600});'
          "$RMD_BIN_DIR/relay" version --verify --json
          "$RMD_BIN_DIR/relay" --help
          "$RMD_BIN_DIR/relay" init "$RUNNER_TEMP/notes"
          "$RMD_BIN_DIR/relay" status "$RUNNER_TEMP/notes" --state-dir "$RUNNER_TEMP/state"
          trap '"$RMD_BIN_DIR/relay" stop --state-dir "$RUNNER_TEMP/state"' EXIT
          "$RMD_BIN_DIR/relay" start --state-dir "$RUNNER_TEMP/state"
          "$RMD_BIN_DIR/relay" upgrade --enable-automatic-updates
          "$RMD_BIN_DIR/relay" update --disable-automatic-updates
          "$RMD_BIN_DIR/relay" update --pin
          "$RMD_BIN_DIR/relay" update --unpin
      - name: Exercise native default directories
        shell: sh
        env:
          RMD_RELEASE_DIR: ${{ runner.temp }}/releases
          RMD_STORAGE_KEY_FILE: ${{ runner.temp }}/storage.key
          RMD_INSTALL_DIR: ''
          RMD_BIN_DIR: ''
          XDG_CONFIG_HOME: ''
          XDG_DATA_HOME: ''
          XDG_STATE_HOME: ''
        run: |
          case "$(uname -s)" in
            Darwin)
              relay_install_dir="$HOME/Library/Application Support/relay"
              relay_config="$relay_install_dir/config.toml"
              relay_state="$relay_install_dir/state"
              ;;
            Linux)
              relay_install_dir="$HOME/.local/share/relay-cli"
              relay_config="$HOME/.config/relay/config.toml"
              relay_state="$HOME/.local/state/relay"
              ;;
          esac
          sh install.sh
          test -L "$relay_install_dir/current"
          test -L "$HOME/.local/bin/relay"
          "$HOME/.local/bin/relay" version --verify --json
          "$HOME/.local/bin/relay" upgrade --enable-automatic-updates
          test -f "$relay_config"
          "$HOME/.local/bin/relay" update --disable-automatic-updates
          trap '"$HOME/.local/bin/relay" stop' EXIT
          "$HOME/.local/bin/relay" start
          "$HOME/.local/bin/relay" status --json > "$RUNNER_TEMP/native-status.json"
          "$HOME/.local/bin/relay" logging status --json > "$RUNNER_TEMP/native-logging.json"
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const [state, config] = process.argv.slice(1);
            const status = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/native-status.json`));
            const logging = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/native-logging.json`));
            assert.equal(status.daemon.running, true);
            assert.equal(status.daemon.stateDir, state);
            assert.equal(logging.settingsPath, config);
          ' "$relay_state" "$relay_config"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ runner.temp }}/releases/
          if-no-files-found: error
  required:
    name: Public build
    if: always()
    needs: [build, install]
    runs-on: ubuntu-latest
    steps:
      - name: Require every build to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          INSTALL_RESULT: ${{ needs.install.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$INSTALL_RESULT" = success
